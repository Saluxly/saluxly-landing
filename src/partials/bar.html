<a class="skip" href="#main">{{t.nav.skip}}</a>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs><radialGradient id="node" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="#FFC08A"/><stop offset="45%" stop-color="#D76821"/><stop offset="100%" stop-color="#AB3402"/></radialGradient></defs></svg>
<header class="bar" data-bar>
  <div class="wrap bar-inner">
    <a class="brand" href="{{base}}" aria-label="{{t.nav.home}}">{{> mark}}<span class="wordmark">Salux<span>ly</span></span></a>
    <nav class="bar-nav" aria-label="{{t.nav.main}}">
      <a href="{{base}}#how">{{t.nav.how}}</a>
      <a href="{{base}}#product">{{t.nav.product}}</a>
      <a href="{{base}}#pricing">{{t.nav.pricing}}</a>
      <a href="{{base}}#faq">{{t.nav.faq}}</a>
    </nav>
    <div class="bar-right">
      <nav class="langs" aria-label="{{t.nav.language}}">
        {{#each alternates}}<a href="{{path}}" hreflang="{{lang}}" lang="{{lang}}" data-lang="{{lang}}"{{#if current}} aria-current="page"{{/if}}><b>{{lang}}</b></a>{{/each}}
      </nav>
      {{#unless launched}}<a class="button button--nav" href="#waitlist">{{t.nav.join}}</a>{{/unless}}
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="menu" aria-label="{{t.nav.menu}}" data-menu-button>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="menu-open" d="M4 7h16M4 12h16M4 17h16"/><path class="menu-close" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="offer" id="offer" hidden data-offer><div class="wrap"><a href="#" data-offer-link></a><button type="button" class="offer-dismiss" data-offer-dismiss></button></div></div>
</header>
<div class="menu" id="menu" hidden data-menu>
  <nav class="menu-links" aria-label="{{t.nav.main}}">
    <a href="{{base}}#how">{{t.nav.how}}</a>
    <a href="{{base}}#product">{{t.nav.product}}</a>
    <a href="{{base}}#pricing">{{t.nav.pricing}}</a>
    <a href="{{base}}#faq">{{t.nav.faq}}</a>
  </nav>
  {{#unless launched}}<a class="button button--form" href="#waitlist">{{t.nav.join}}</a>{{/unless}}
</div>
