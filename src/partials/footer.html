<footer class="footer">
  <div class="wrap footer-inner">
    <div class="footer-about">
      <a class="brand brand--small" href="{{base}}" aria-label="{{t.nav.home}}">{{> mark}}<span class="wordmark">Salux<span>ly</span></span></a>
      <p>{{t.footer.text}}</p>
      <p class="footer-copy">{{t.footer.copyright}}</p>
    </div>
    <nav class="footer-links" aria-label="{{t.footer.legal}}">
      <a href="/privacy.html">{{t.footer.privacy}}</a>
      <a href="/terms.html">{{t.footer.terms}}</a>
      <a href="{{base}}support.html">{{t.footer.support}}</a>
      <a href="{{base}}delete-account.html">{{t.footer.delete}}</a>
    </nav>
    <div class="footer-contact">
      <a href="mailto:contact@saluxly.com">contact@saluxly.com</a>
      <nav class="langs" aria-label="{{t.nav.language}}">
        {{#each alternates}}<a href="{{path}}" hreflang="{{lang}}" lang="{{lang}}" data-lang="{{lang}}"{{#if current}} aria-current="page"{{/if}}><b>{{lang}}</b></a>{{/each}}
      </nav>
    </div>
  </div>
</footer>
<script src="/assets/site.js" defer></script>
